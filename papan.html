<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papan Skor Hauling Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: layar besar landscape. Kiri: logo, QR untuk main, statistik. Kanan: 10 besar. Di layar sempit bertumpuk. */
:root{
  --coal:#12100e; --ash:#28231d; --line:#463d33;
  --fg:#f4ede4; --muted:#b9ad9f;
  --ember:#ff8a3d; --lamp:#ffd36b; --leaf:#62c483;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(70% 60% at 15% 10%,rgba(255,211,107,.14),rgba(18,16,14,0) 60%),var(--coal);color:var(--fg);font-family:var(--font-body)}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(280px,28%) minmax(0,1fr);gap:clamp(20px,3vw,56px);padding:clamp(10px,2.4vh,40px) clamp(20px,3vw,52px)}
.side{display:flex;flex-direction:column;gap:clamp(16px,2vh,28px)}
.logo{font-family:var(--font-display);font-weight:900;font-size:clamp(56px,6.2vw,118px);line-height:.82;color:var(--lamp);text-shadow:0 0 34px rgba(255,211,107,.4);margin:0}
.logo span{display:block;color:var(--fg);text-shadow:none}
.tagline{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,2vw,34px);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 0}
.qr{align-self:flex-start;background:#fff;color:#16120e;border-radius:22px;padding:16px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
#qr{width:clamp(170px,15vw,270px);aspect-ratio:1;max-width:100%}
#qr canvas,#qr img{width:100%!important;height:auto!important;display:block}
.qr b{font-family:var(--font-display);font-weight:900;font-size:clamp(26px,2.2vw,36px);line-height:1}
.qr span{font-size:13px;font-weight:700;color:#5d544a;overflow-wrap:anywhere;text-align:center;max-width:clamp(170px,15vw,270px)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 90px;background:var(--ash);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--font-display);font-weight:900;font-size:clamp(34px,3vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.rules{font-size:clamp(13px,1vw,16px);line-height:1.55;color:var(--muted);margin:0;max-width:40ch}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.head>div{display:flex;align-items:baseline;gap:6px 22px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(36px,min(4.4vw,6.4vh),80px);line-height:1;margin:0}
.status{font-size:14px;font-weight:700;color:var(--muted)}
.status.warn{color:var(--lamp)}
.sect{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(5px,.9vh,10px)}
#rows{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px)}
.row{display:grid;grid-template-columns:clamp(44px,4vw,72px) 1fr auto;align-items:center;gap:clamp(10px,1.2vw,22px);border-radius:16px;padding:clamp(4px,.8vh,10px) clamp(14px,1.5vw,26px);background:var(--ash);min-width:0}
.row .rk{font-family:var(--font-display);font-weight:900;text-align:center;line-height:1;color:var(--muted)}
.row .who{min-width:0;overflow:hidden}
.row .nm{font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta .done{color:var(--leaf);font-weight:800}
.row .sc{font-family:var(--font-display);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
/* peringkat 1, 2, 3: tiga warna berbeda */
.r1,.r2,.r3{padding-block:clamp(5px,1vh,14px)}
.r1 .rk,.r2 .rk,.r3 .rk{font-size:clamp(28px,4.6vh,52px)}
.r1 .nm,.r2 .nm,.r3 .nm{font-size:clamp(18px,3vh,34px)}
.r1 .meta,.r2 .meta,.r3 .meta{font-size:clamp(12px,1.7vh,17px)}
.r1 .sc,.r2 .sc,.r3 .sc{font-size:clamp(30px,4.8vh,54px)}
.r1{background:linear-gradient(90deg,#8a6a12,#4a3a10 75%);border:2px solid #ffd36b}
.r1 .rk,.r1 .sc{color:#ffd36b}
.r2{background:linear-gradient(90deg,#69717c,#3c4148 75%);border:2px solid #d4dbe3}
.r2 .rk,.r2 .sc{color:#e8edf2}
.r3{background:linear-gradient(90deg,#8c5528,#4a2f18 75%);border:2px solid #e0a067}
.r3 .rk,.r3 .sc{color:#f0b27a}
/* peringkat 4 dan 5: satu warna yang sama */
.r4{background:linear-gradient(90deg,#1f5a66,#1b3a42 75%);border:2px solid #4fb3c8}
.r4 .rk,.r4 .sc{color:#8fdcec}
.r4 .nm{font-size:clamp(16px,2.5vh,28px)}
.r4 .rk{font-size:clamp(24px,3.7vh,42px)}
.r4 .sc{font-size:clamp(26px,3.9vh,44px)}
.r4 .meta{font-size:clamp(12px,1.5vh,16px)}
/* peringkat 6 sampai 25: abu-abu */
.rest{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(10,auto);grid-auto-flow:column;column-gap:clamp(10px,1.2vw,22px);row-gap:clamp(3px,.6vh,7px);list-style:none;margin:0;padding:0}
.r6{padding-block:clamp(2px,.4vh,5px);border-radius:10px;grid-template-columns:clamp(30px,2.6vw,44px) 1fr auto}
.r6 .rk{font-size:clamp(17px,2.5vh,26px)}
.r6 .nm{font-size:clamp(14px,2.2vh,22px);display:inline}
.r6 .meta{font-size:clamp(11px,1.5vh,14px);display:inline;margin-left:8px}
.r6 .sc{font-size:clamp(18px,2.8vh,30px)}
.row.fresh{animation:fresh 2.6s ease-out}
@keyframes fresh{0%{filter:brightness(1.8);transform:scale(1.015)}100%{filter:none;transform:none}}
.date{font-size:clamp(14px,1.2vw,20px);font-weight:700;color:var(--lamp);letter-spacing:.04em}

.empty{font-size:clamp(18px,1.6vw,26px);color:var(--muted);background:var(--ash);border-radius:16px;padding:32px;margin:0;text-align:center}
.ticker{align-self:flex-start;background:rgba(98,196,131,.14);border:1px solid rgba(98,196,131,.45);border-radius:999px;padding:10px 18px;font-size:clamp(15px,1.2vw,20px);font-weight:700}
.ticker b{color:var(--leaf)}
.fs{position:fixed;top:14px;right:14px;background:rgba(40,35,29,.85);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:700 13px var(--font-body);cursor:pointer}
.fs:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
@media (max-width:860px){ .wrap{grid-template-columns:minmax(0,1fr)} .rest{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row} .r6 .nm,.r6 .meta{display:block;margin-left:0} .r1 .nm,.r2 .nm,.r3 .nm,.r4 .nm{font-size:18px} }
@media (prefers-reduced-motion: reduce){ .row.fresh{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div>
      <p class="logo">HAULING<span>RUN</span></p>
      <p class="tagline">Lari sampai pulang selamat</p>
    </div>
    <div class="qr">
      <div id="qr" role="img" aria-label="Kode QR untuk membuka game"></div>
      <b>Scan &amp; main</b>
      <span id="gameUrl"></span>
    </div>
    <div class="stats">
      <div class="stat"><span>Pemain</span><b id="sPlayers">0</b></div>
      <div class="stat"><span>Pulang</span><b id="sDone">0</b></div>
      <div class="stat"><span>Kali main</span><b id="sPlays">0</b></div>
    </div>
    <div class="ticker" id="ticker" hidden></div>
    <p class="rules">Skor = jarak (1 poin per meter) + 25 per bibit + 100 tiap masuk zona baru. Mulai skor 5.000, lari makin kencang. Skor sama? Yang waktunya lebih singkat menang.</p>
  </aside>
  <main class="main">
    <div class="head"><div><h1>Papan Skor</h1><div class="date" id="today"></div></div><span class="status" id="status">Memuat…</span></div>
    <div id="rows"></div>
  </main>
</div>
<button class="fs" id="fs" type="button">Layar penuh</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const API = (typeof window.HAUL_API === "string" && /^https?:\/\/[^ ]+$/.test(window.HAUL_API.trim())) ? window.HAUL_API.trim() : "";
const SESI = String(window.HAUL_SESI || "umum").slice(0, 40);
const GAME_URL = window.HAUL_GAME_URL || new URL("./", location.href).href;
const REFRESH_MS = 5000;

$("gameUrl").textContent = GAME_URL.replace(/^https?:\/\//, "").replace(/\/$/, "");
try{
  if(window.QRCode) new QRCode($("qr"), {text:GAME_URL, width:540, height:540, colorDark:"#16120e", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M});
  else $("qr").hidden = true;
}catch(e){ $("qr").hidden = true; }

function secs(ms){ return (ms / 1000).toFixed(1).replace(".", ",") + " dtk"; }
function fmt(n){ return Number(n).toLocaleString("id-ID"); }
function status(text, warn){ const s = $("status"); s.textContent = text; s.className = "status" + (warn ? " warn" : ""); }

let prev = null;
function fmtDate(at){ return new Date(at).toLocaleString("id-ID", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}).replace(",", ""); }
function makeRow(e, i){
  const li = document.createElement("li");
  const cls = i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : i < 5 ? "r4" : "r6";
  li.className = "row " + cls;
  if(prev && prev[e.key] !== e.score) li.classList.add("fresh");
  const status = e.done ? '<span class="done">Pulang selamat</span> · ' : '';
  li.innerHTML = '<span class="rk">' + (i + 1) + '</span><div class="who"><div class="nm"></div><div class="meta">' + status + fmt(e.m) + ' m · ' + fmt(e.bibit) + ' bibit · ' + fmtDate(e.at) + '</div></div><span class="sc">' + fmt(e.score) + '</span>';
  li.querySelector(".nm").textContent = e.name;
  return li;
}
function render(j){
  $("sPlayers").textContent = fmt(j.players || 0);
  $("sDone").textContent = fmt(j.finished || 0);
  $("sPlays").textContent = fmt(j.plays || 0);
  $("today").textContent = new Date().toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  const list = (j.list || []).slice(0, 25);
  const rows = $("rows"); rows.innerHTML = "";
  if(!list.length){
    const p = document.createElement("p"); p.className = "empty"; p.textContent = "Belum ada skor. Scan QR-nya dan jadi yang pertama!"; rows.appendChild(p);
  } else {
    const top = document.createElement("ol"); top.className = "sect"; top.style.listStyle = "none"; top.style.margin = "0"; top.style.padding = "0";
    const rest = document.createElement("ol"); rest.className = "rest";
    list.forEach((e, i) => { (i < 5 ? top : rest).appendChild(makeRow(e, i)); });
    rows.appendChild(top); if(rest.children.length) rows.appendChild(rest);
  }
  prev = {}; (j.list || []).forEach(e => { prev[e.key] = e.score; });
  const t = $("ticker"), L = j.latest;
  if(L && Date.now() - L.at < 10 * 60 * 1000){
    t.innerHTML = 'Baru saja: <b></b> · <span></span>';
    t.querySelector("b").textContent = L.name;
    t.querySelector("span").textContent = fmt(L.score) + " poin · " + (L.done ? "pulang selamat" : fmt(L.m) + " m");
    t.hidden = false;
  } else t.hidden = true;
}

async function poll(){
  if(!API){ status("Isi alamat Web App di config.js dulu.", true); render({list:[]}); return; }
  try{
    const r = await fetch(API + "?action=board&sesi=" + encodeURIComponent(SESI), {cache:"no-store"});
    const j = await r.json();
    if(!j || !j.ok) throw new Error("respon");
    render(j);
    status("Diperbarui " + new Date().toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit", second:"2-digit"}), false);
  }catch(e){
    status("Koneksi terputus, mencoba lagi…", true);
  }
}
poll();
setInterval(poll, REFRESH_MS);

$("fs").addEventListener("click", () => {
  const d = document.documentElement;
  if(d.requestFullscreen) d.requestFullscreen().catch(() => {});
});
document.addEventListener("fullscreenchange", () => { $("fs").hidden = !!document.fullscreenElement; });
})();
</script>
</body>
</html>
